# Private MKW IPA builder — loose ExeFS+RomFS from Drive zip parts (no NSP).
# Uses private fork Constellarw/nxnative-sw2 (Ampere/NVN2).
name: Build MKW IPA (extracted)

on:
  workflow_dispatch:
    inputs:
      nxnative_ref:
        description: "nxnative-sw2 git ref"
        required: false
        default: "main"
      dump_source:
        description: "auto = Release cache first; drive = force Drive parts"
        required: false
        type: choice
        default: auto
        options: [auto, drive]

permissions:
  contents: write

env:
  DUMP_TAG: mkw-dump-v1
  TITLE_ID: "0400C3F00006E000"
  DISPLAY_VER: "1.8.0"
  GAME_NAME: "Mario Kart World"
  DM_ALLOW_OTHER_METAL: "1"
  # Prefer in-repo locked spirv-cross (not brew)
  SPIRV_CROSS: ${{ github.workspace }}/nxnative/dm/gfx/tools/spirv_cross_bin/spirv-cross

concurrency:
  group: mkw-ipa
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA on Apple Silicon
    runs-on: macos-14
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /Applications/Xcode_*.app/Contents/Developer/Platforms/iPhoneSimulator.platform \
            /Applications/Xcode_*.app/Contents/Developer/Platforms/AppleTV*.platform \
            /Applications/Xcode_*.app/Contents/Developer/Platforms/Watch*.platform \
            /Applications/Xcode_*.app/Contents/Developer/Platforms/XROS*.platform \
            /Library/Developer/CoreSimulator \
            ~/Library/Developer/CoreSimulator \
            /usr/local/share/android* \
            /usr/share/dotnet \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            || true
          df -h /

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Metal toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphoneos metal --version
          xcrun -sdk macosx metal --version

      - name: Checkout nxnative-sw2
        uses: actions/checkout@v4
        with:
          repository: Constellarw/nxnative-sw2
          ref: ${{ inputs.nxnative_ref }}
          token: ${{ secrets.NXNATIVE_PAT }}
          path: nxnative

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross glslang unar
          brew install --cask dotnet-sdk || true
          python3 -m venv "$HOME/nx-venv"
          source "$HOME/nx-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install lz4 capstone fonttools "backports.zstd; python_version < '3.14'" gdown nsz
          echo "$HOME/nx-venv/bin" >> "$GITHUB_PATH"

      - name: Decode prod.keys (optional for extracted)
        env:
          PROD_KEYS_B64: ${{ secrets.PROD_KEYS_B64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/keys"
          if [ -n "${PROD_KEYS_B64:-}" ]; then
            echo "$PROD_KEYS_B64" | base64 --decode > "$HOME/keys/prod.keys"
            chmod 600 "$HOME/keys/prod.keys"
            echo "prod.keys ready ($(wc -c < "$HOME/keys/prod.keys") bytes)"
          else
            echo "No PROD_KEYS_B64 — continuing (extracted path)."
          fi


      - name: Preflight shader toolchain (fail before dump download)
        working-directory: nxnative
        run: |
          set -euo pipefail
          test -x dm/gfx/tools/spirv_cross_bin/spirv-cross
          test -x dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate || test -f dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate
          export SPIRV_CROSS="$PWD/dm/gfx/tools/spirv_cross_bin/spirv-cross"
          export XLATE="$PWD/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate"
          python - <<'PY'
          import sys
          sys.path.insert(0, "dm/gfx/tools")
          import own_compilers as o
          # signature must accept metal= (the bug that burned the last dump download)
          o.check_tools(metal=True)
          o.check_tools(metal=False)
          print("own_compilers.check_tools(metal=) OK")
          # smoke import path used by the build
          import runpy, os
          os.environ.setdefault("DM_ALLOW_OTHER_METAL", "1")
          # do not run full dmsh_build; only verify monkeypatch assignment works
          o.dmsh_chain.check_tools = o.check_tools
          o.dmsh_chain.check_tools(metal=True)
          print("monkeypatched check_tools(metal=True) OK")
          PY
          python dm/gfx/tools/own_compilers.py --check-metal || true
          echo "preflight ok"

      - name: Download dump from private release
        env:
          GH_TOKEN: ${{ secrets.NXNATIVE_PAT }}
          DUMP_SOURCE: ${{ inputs.dump_source }}
        run: |
          set -euo pipefail
          DEST="$HOME/Games/MKW"
          PARTS="$HOME/.ci/dump-parts"
          mkdir -p "$DEST" "$PARTS"
          DUMP_REPO="${DUMP_CACHE_REPO:-Constellarw/nxnative-mkw-dump}"
          TAG="${DUMP_TAG}"
          echo "Fetching $DUMP_REPO@$TAG …"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::NXNATIVE_PAT secret required to read private dump cache"
            exit 1
          fi
          gh release download "$TAG" --repo "$DUMP_REPO" -p manifest.tsv -D "$PARTS" --clobber
          # fail-fast: download parts one by one, verify size+sha
          while IFS=$'\t' read -r idx name size sha; do
            [ -n "${idx:-}" ] || continue
            echo "part $name ($size bytes)"
            gh release download "$TAG" --repo "$DUMP_REPO" -p "$name" -D "$PARTS" --clobber
            got=$(stat -f %z "$PARTS/$name")
            got_sha=$(shasum -a 256 "$PARTS/$name" | cut -d' ' -f1)
            if [ "$got" != "$size" ] || [ "$got_sha" != "$sha" ]; then
              echo "::error::Bad part $name size=$got/$size sha=$got_sha/$sha"
              exit 1
            fi
          done < "$PARTS/manifest.tsv"
          echo "Concatenating…"
          : > "$DEST/mkw917504.tar"
          while IFS=$'\t' read -r idx name size sha; do
            [ -n "${idx:-}" ] || continue
            cat "$PARTS/$name" >> "$DEST/mkw917504.tar"
            rm -f "$PARTS/$name"
          done < "$PARTS/manifest.tsv"
          rm -rf "$PARTS"
          echo "Extracting tar…"
          tar -C "$DEST" -xf "$DEST/mkw917504.tar"
          rm -f "$DEST/mkw917504.tar"
          test -d "$DEST/917504/exefs" && test -d "$DEST/917504/romfs"
          du -sh "$DEST/917504"
          echo "DUMP_FROM=private-release" >> "$GITHUB_ENV"

      - name: Refresh dmsh chain header
        working-directory: nxnative
        run: |
          set -euo pipefail
          # Do NOT --update-lock on CI: would rewrite fingerprints to the runner and hide real mismatches.
          python dm/gfx/tools/dmsh_chain.py --header

      - name: Build IPA from extracted dump
        working-directory: nxnative
        env:
          DM_ALLOW_OTHER_METAL: "1"
        run: |
          set -euo pipefail
          export SPIRV_CROSS="$PWD/dm/gfx/tools/spirv_cross_bin/spirv-cross"
          export XLATE="$PWD/dm/gfx/tools/dmsh_xlate_bin/dmsh_xlate"
          DUMP="$HOME/Games/MKW/917504"
          test -d "$DUMP/exefs"
          test -d "$DUMP/romfs"
          WORK="$RUNNER_TEMP/xbuild"
          mkdir -p "$WORK"
          python scripts/build_ipa_from_extracted.py "$DUMP" \
            --title-id "$TITLE_ID" \
            --version v917504 \
            --display "$DISPLAY_VER" \
            --name "$GAME_NAME" \
            --work "$WORK" \
            --romfs separate
          IPA=$(find "$WORK" -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No IPA produced"
            find "$WORK" -maxdepth 3 | head -100
            exit 1
          fi
          cp "$IPA" "$RUNNER_TEMP/MarioKartWorld.ipa"
          ls -lh "$RUNNER_TEMP/MarioKartWorld.ipa"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MKW-IPA
          path: ${{ runner.temp }}/MarioKartWorld.ipa
          retention-days: 3

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MKW-build-logs
          path: |
            ${{ runner.temp }}/xbuild/**/logs/**
            ${{ runner.temp }}/xbuild/**/*.log
          if-no-files-found: ignore
          retention-days: 7
